<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Job Scheduler</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<!-- Monaco Editor (the engine that powers VS Code) -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #1e2130; }
  ::-webkit-scrollbar-thumb { background: #3b4465; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4b5585; }

  textarea, input, select {
    background: #1a1f35;
    border: 1px solid #2a3050;
    border-radius: 6px;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus, input:focus, select:focus { border-color: #3b82f6; }
  select option { background: #1a1f35; }
  input::placeholder, textarea::placeholder { color: #4a5580; }

  button { cursor: pointer; font-family: 'Segoe UI', system-ui, sans-serif; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

// ─── Constants & helpers ─────────────────────────────────────────────────────
const POLL_MS    = 2000;
const DRAFT_KEY  = 'gpu_scheduler_draft';

const TEMPLATES = {
  'hello-gpu': {
    runtime: 'pytorch-cu121',
    code: `import torch

print(f"PyTorch: {torch.__version__}")
print(f"CUDA available: {torch.cuda.is_available()}")

if torch.cuda.is_available():
    print(f"Device: {torch.cuda.get_device_name(0)}")
    x = torch.randn(1000, 1000, device='cuda')
    y = x @ x.T
    print(f"Result sum: {y.sum().item():.2f}")
`
  },
  'save-artifact': {
    runtime: 'pytorch-cu121',
    code: `import os
import torch

output_dir = os.environ.get('OUTPUT_DIR', '/workspace/output')
os.makedirs(output_dir, exist_ok=True)

model = torch.nn.Linear(10, 1).cuda()
print("Training complete")

torch.save(model.state_dict(), os.path.join(output_dir, 'model.pt'))

with open(os.path.join(output_dir, 'metrics.txt'), 'w') as f:
    f.write("accuracy: 0.95\\nloss: 0.05\\n")

print(f"Artifacts saved to {output_dir}")
`
  },
  'train-mnist': {
    runtime: 'pytorch-cu121',
    code: `import os
import torch
import torch.nn as nn
import torch.optim as optim

output_dir = os.environ.get('OUTPUT_DIR', '/workspace/output')
os.makedirs(output_dir, exist_ok=True)

device = 'cuda' if torch.cuda.is_available() else 'cpu'
print(f"Using device: {device}")

model = nn.Sequential(
    nn.Flatten(), nn.Linear(784, 128), nn.ReLU(), nn.Linear(128, 10),
).to(device)

opt = optim.Adam(model.parameters(), lr=1e-3)
loss_fn = nn.CrossEntropyLoss()

x = torch.randn(256, 1, 28, 28, device=device)
y = torch.randint(0, 10, (256,), device=device)

for epoch in range(10):
    opt.zero_grad()
    loss = loss_fn(model(x), y)
    loss.backward()
    opt.step()
    print(f"Epoch {epoch+1:2d} | loss = {loss.item():.4f}")

torch.save(model.state_dict(), os.path.join(output_dir, 'mnist_model.pt'))
print("Model saved.")
`
  },
  'use-dataset': {
    runtime: 'pytorch-cu121',
    code: `import os

data_dir = os.environ.get('DATA_DIR')
if not data_dir or not os.path.isdir(data_dir):
    print("No dataset uploaded — DATA_DIR is not set.")
else:
    print(f"Dataset directory: {data_dir}")
    for root, dirs, files in os.walk(data_dir):
        rel = os.path.relpath(root, data_dir)
        for f in files:
            full = os.path.join(rel, f) if rel != '.' else f
            size = os.path.getsize(os.path.join(root, f))
            print(f"  {full}  ({size} bytes)")
`
  },
  'hello-tf': {
    runtime: 'tensorflow',
    code: `import tensorflow as tf

print(f"TF version: {tf.__version__}")
print(f"GPUs: {tf.config.list_physical_devices('GPU')}")

a = tf.random.normal((1000, 1000))
b = tf.matmul(a, a, transpose_b=True)
print(f"Sum: {tf.reduce_sum(b).numpy():.2f}")
`
  },
};

const fmtDuration = s => {
  if (s == null) return '—';
  if (s >= 3600) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
  if (s >= 60)   return `${Math.floor(s/60)}m ${Math.floor(s%60)}s`;
  return `${Math.round(s)}s`;
};

const fmtSize = b => {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(1) + ' MB';
};

const apiHeaders = (apiKey) => apiKey ? { 'X-API-Key': apiKey } : {};

// ─── UI primitives ───────────────────────────────────────────────────────────
function Spinner({ size = 14 }) {
  return (
    <span style={{
      display:'inline-block', width:size, height:size,
      border:'2px solid #2a3050', borderTopColor:'#3b82f6',
      borderRadius:'50%', animation:'spin 0.7s linear infinite', flexShrink:0,
    }}/>
  );
}

function Badge({ status }) {
  const cfg = {
    queued:    { bg:'#1e3a5f', color:'#60a5fa', label:'QUEUED' },
    running:   { bg:'#3d2200', color:'#fb923c', label:'RUNNING' },
    completed: { bg:'#0f2e1a', color:'#4ade80', label:'COMPLETED' },
    failed:    { bg:'#2d0f0f', color:'#f87171', label:'FAILED' },
    cancelled: { bg:'#1e1e2e', color:'#94a3b8', label:'CANCELLED' },
  };
  const c = cfg[status] || cfg.queued;
  return (
    <span style={{
      background:c.bg, color:c.color, border:`1px solid ${c.color}33`,
      borderRadius:4, padding:'2px 8px', fontSize:11, fontWeight:700,
      letterSpacing:'0.05em', whiteSpace:'nowrap',
    }}>{c.label}</span>
  );
}

function StatCard({ label, value, color }) {
  return (
    <div style={{
      background:'#1e2130', border:'1px solid #2a3050',
      borderRadius:10, padding:'16px 20px', flex:1, minWidth:110,
    }}>
      <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>{label}</div>
      <div style={{ fontSize:28, fontWeight:700, color: color || '#e2e8f0', lineHeight:1 }}>{value}</div>
    </div>
  );
}

function GpuChip({ gpu }) {
  const isIdle = gpu.status === 'idle';
  return (
    <div style={{
      display:'flex', flexDirection:'column', gap:4,
      background: isIdle ? '#0f2e1a' : '#2d1a00',
      border:`1px solid ${isIdle ? '#166534' : '#92400e'}`,
      borderRadius:8, padding:'10px 14px', minWidth:110,
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <span style={{ width:8, height:8, borderRadius:'50%', background: isIdle ? '#4ade80' : '#fb923c', flexShrink:0 }}/>
        <span style={{ fontWeight:600, fontSize:13 }}>GPU {gpu.gpu_id}</span>
        <span style={{ marginLeft:'auto', fontSize:10, fontWeight:700, color: isIdle ? '#4ade80' : '#fb923c' }}>{gpu.status.toUpperCase()}</span>
      </div>
      {gpu.job_id && (
        <div style={{ fontSize:11, color:'#fb923c', fontFamily:'monospace' }}>
          {gpu.job_id.substring(0, 8)}…
        </div>
      )}
    </div>
  );
}

// ─── Code editor (Monaco — same engine as VS Code) ───────────────────────────
function CodeEditor({ value, onChange, height = 280 }) {
  const containerRef = useRef(null);
  const editorRef    = useRef(null);
  const onChangeRef  = useRef(onChange);
  const [loaded, setLoaded] = useState(false);

  // Keep the latest onChange in a ref so the Monaco listener always sees current
  useEffect(() => { onChangeRef.current = onChange; }, [onChange]);

  // Initialize Monaco once (loader.js is loaded in <head>)
  useEffect(() => {
    let disposed = false;
    let attempts = 0;

    const init = () => {
      if (typeof window.require === 'undefined') {
        // loader.js not yet attached — retry briefly
        if (attempts++ < 60) setTimeout(init, 50);
        return;
      }
      window.require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
      window.require(['vs/editor/editor.main'], () => {
        if (disposed || !containerRef.current) return;

        editorRef.current = window.monaco.editor.create(containerRef.current, {
          value:     value || '',
          language:  'python',
          theme:     'vs-dark',
          automaticLayout:      true,
          fontSize:             13,
          fontFamily:           "'Cascadia Code','Fira Code','Consolas',monospace",
          minimap:              { enabled: false },
          scrollBeyondLastLine: false,
          tabSize:              4,
          insertSpaces:         true,
          padding:              { top: 12, bottom: 12 },
          renderLineHighlight:  'line',
          smoothScrolling:      true,
          cursorBlinking:       'smooth',
        });

        editorRef.current.onDidChangeModelContent(() => {
          onChangeRef.current(editorRef.current.getValue());
        });

        setLoaded(true);
      });
    };

    init();

    return () => {
      disposed = true;
      if (editorRef.current) {
        editorRef.current.dispose();
        editorRef.current = null;
      }
    };
  }, []);

  // Sync prop -> editor (template loading, Repeat, draft restore)
  useEffect(() => {
    if (editorRef.current && value !== editorRef.current.getValue()) {
      editorRef.current.setValue(value || '');
    }
  }, [value]);

  return (
    <div style={{
      position:'relative', height, borderRadius:6, overflow:'hidden',
      border:'1px solid #2a3050', background:'#1e1e1e',
    }}>
      {!loaded && (
        <div style={{
          position:'absolute', inset:0, display:'flex', alignItems:'center',
          justifyContent:'center', gap:10, color:'#64748b', fontSize:13, zIndex:1,
        }}>
          <Spinner /> <span>Loading Monaco editor…</span>
        </div>
      )}
      <div ref={containerRef} style={{ width:'100%', height:'100%' }} />
    </div>
  );
}

// ─── Output Panel (live stream + final view) ─────────────────────────────────
function OutputPanel({ jobId, apiKey, onClose }) {
  const [job, setJob]         = useState(null);
  const [tab, setTab]         = useState('stdout');
  const [liveLines, setLive]  = useState([]);
  const [elapsed, setElapsed] = useState(0);
  const [finished, setFinished] = useState(false);
  const logRef = useRef(null);
  const sseRef = useRef(null);

  // Fetch initial job + poll while needed
  useEffect(() => {
    if (!jobId) return;
    let alive = true;

    const refresh = async () => {
      try {
        const j = await fetch(`/jobs/${jobId}`, { headers: apiHeaders(apiKey) }).then(r => r.json());
        if (!alive) return;
        setJob(j);
        if (['completed','failed','cancelled'].includes(j.status)) setFinished(true);
      } catch(e) {}
    };
    refresh();
    const iv = setInterval(refresh, 2000);
    return () => { alive = false; clearInterval(iv); };
  }, [jobId, apiKey]);

  // SSE for live logs (only while not finished)
  useEffect(() => {
    if (!jobId || finished) return;
    setLive([]);
    if (sseRef.current) sseRef.current.close();
    const es = new EventSource(`/jobs/${jobId}/logs/stream`);
    sseRef.current = es;

    es.onmessage = (e) => {
      let data; try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === 'end') { setFinished(true); es.close(); return; }
      if (data.type === 'stdout' || data.type === 'stderr') {
        setLive(prev => [...prev, { stream: data.type, line: data.line || '' }]);
      }
    };
    es.onerror = () => { es.close(); };
    return () => es.close();
  }, [jobId, finished]);

  // ETA timer for running jobs
  useEffect(() => {
    if (job?.status !== 'running' || !job?.started_at) return;
    const startMs = new Date(job.started_at).getTime();
    const tick = () => setElapsed(Math.floor((Date.now() - startMs) / 1000));
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [job?.status, job?.started_at]);

  // Auto-scroll
  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [liveLines.length]);

  if (!job) {
    return (
      <div style={{
        background:'#141824', border:'1px solid #2a3050', borderRadius:10,
        padding:30, textAlign:'center', color:'#475569',
      }}>
        <Spinner /> <span style={{ marginLeft:10 }}>Loading job…</span>
      </div>
    );
  }

  const isRunning = job.status === 'running';
  const isQueued  = job.status === 'queued';
  const showLive  = (isRunning || isQueued) && !finished;
  const stderrLines = (job.stderr || '').split('\n').filter(Boolean);
  const stdoutLines = (job.stdout || '').split('\n').filter(Boolean);
  const artifacts = job.artifacts || [];

  return (
    <div style={{ background:'#141824', border:'1px solid #2a3050', borderRadius:10, overflow:'hidden', animation:'fadeIn 0.2s ease' }}>
      {/* Header */}
      <div style={{ background:'#1a1f35', borderBottom:'1px solid #2a3050', padding:'10px 16px', display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
        {isRunning ? (
          <>
            <span style={{ width:10, height:10, borderRadius:'50%', background:'#fb923c', boxShadow:'0 0 8px #fb923c', flexShrink:0, animation:'pulse 1.5s infinite' }}/>
            <span style={{ color:'#fb923c', fontWeight:600 }}>Running on GPU {job.gpu_id ?? '?'}</span>
            <span style={{ color:'#64748b' }}>· {elapsed}s elapsed</span>
          </>
        ) : isQueued ? (
          <>
            <span style={{ width:10, height:10, borderRadius:'50%', background:'#60a5fa', flexShrink:0, animation:'pulse 1.5s infinite' }}/>
            <span style={{ color:'#60a5fa', fontWeight:600 }}>
              Queued{job.queue_position != null ? ` — position ${job.queue_position}` : ''}
            </span>
          </>
        ) : (
          <>
            <span style={{ width:10, height:10, borderRadius:'50%', background: job.status === 'completed' ? '#4ade80' : '#f87171', flexShrink:0 }}/>
            <span style={{ fontWeight:600 }}>{job.name || job.job_id.substring(0,8) + '…'}</span>
            <Badge status={job.status} />
            {job.started_at && job.finished_at && (
              <span style={{ color:'#64748b', fontSize:12 }}>
                · {fmtDuration((new Date(job.finished_at) - new Date(job.started_at))/1000)}
              </span>
            )}
          </>
        )}
        {job.student_id && <span style={{ color:'#64748b', fontSize:12 }}>· @{job.student_id}</span>}
        <button onClick={onClose} style={{
          marginLeft:'auto', background:'none', border:'1px solid #2a3050', color:'#64748b',
          borderRadius:6, padding:'4px 10px', fontSize:12,
        }}>✕ Close</button>
      </div>

      {/* Tabs (only when finished) */}
      {!showLive && (
        <div style={{ display:'flex', gap:0, borderBottom:'1px solid #2a3050' }}>
          {['stdout', 'stderr', ...(artifacts.length ? ['artifacts'] : [])].map(t => (
            <button key={t} onClick={() => setTab(t)} style={{
              background: tab === t ? '#0d1117' : 'transparent',
              color: tab === t ? '#e2e8f0' : '#64748b',
              border:'none', borderBottom: tab === t ? '2px solid #3b82f6' : '2px solid transparent',
              padding:'8px 16px', fontSize:13, fontWeight:500, textTransform:'capitalize',
            }}>
              {t}{t === 'stderr' && stderrLines.length > 0 && (
                <span style={{ marginLeft:6, background:'#2d0f0f', color:'#f87171', borderRadius:4, padding:'0 5px', fontSize:11 }}>!</span>
              )}
              {t === 'artifacts' && artifacts.length > 0 && (
                <span style={{ marginLeft:6, background:'#1e3a5f', color:'#60a5fa', borderRadius:4, padding:'0 5px', fontSize:11 }}>{artifacts.length}</span>
              )}
            </button>
          ))}
        </div>
      )}

      {/* Body */}
      {showLive ? (
        <div ref={logRef} style={{
          background:'#0d1117', fontFamily:"'Cascadia Code','Fira Code','Consolas',monospace",
          fontSize:12, lineHeight:1.7, padding:'12px 16px', height:280, overflowY:'auto',
        }}>
          {liveLines.length === 0 ? (
            <div style={{ display:'flex', alignItems:'center', gap:8, color:'#64748b' }}>
              <Spinner /> {isQueued ? 'Waiting for free GPU…' : 'Waiting for output…'}
            </div>
          ) : liveLines.map((l, i) => (
            <div key={i} style={{ color: l.stream === 'stderr' ? '#f87171' : '#4ade80' }}>{l.line || ' '}</div>
          ))}
        </div>
      ) : tab === 'artifacts' ? (
        <div style={{ background:'#0d1117', padding:'12px 16px', minHeight:80 }}>
          {artifacts.map(a => (
            <div key={a.name} style={{
              display:'flex', alignItems:'center', justifyContent:'space-between',
              padding:'8px 12px', borderRadius:6, marginBottom:6, background:'#141824',
              border:'1px solid #2a3050', fontFamily:'monospace', fontSize:13,
            }}>
              <span><span style={{ color:'#93c5fd' }}>{a.name}</span> <span style={{ color:'#64748b', fontSize:11, marginLeft:6 }}>{fmtSize(a.size)}</span></span>
              <a download href={`/jobs/${jobId}/artifacts/${encodeURIComponent(a.name)}`} style={{
                background:'#1e3a5f', color:'#60a5fa', borderRadius:4, padding:'3px 10px',
                fontSize:11, fontWeight:600, textDecoration:'none',
              }}>↓ Download</a>
            </div>
          ))}
        </div>
      ) : (
        <div style={{
          background:'#0d1117', fontFamily:"'Cascadia Code','Fira Code','Consolas',monospace",
          fontSize:12, lineHeight:1.7, padding:'12px 16px', minHeight:120, maxHeight:300,
          overflowY:'auto', color: tab === 'stderr' ? '#f87171' : '#4ade80', whiteSpace:'pre-wrap',
        }}>
          {(tab === 'stderr' ? stderrLines : stdoutLines).map((l, i) => <div key={i}>{l || ' '}</div>)}
          {((tab === 'stderr' ? stderrLines : stdoutLines).length === 0) && (
            <span style={{ color:'#3b4465' }}>No {tab === 'stderr' ? 'errors' : 'output'}</span>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Submit Form ─────────────────────────────────────────────────────────────
function SubmitForm({ runtimes, apiKey, studentId, onStudentIdChange, onSubmit, prefill }) {
  const [mode, setMode]     = useState('paste');
  const [code, setCode]     = useState('# Python code here\nimport torch\nprint(torch.cuda.is_available())\n');
  const [codeFile, setCodeFile]     = useState(null);
  const [repoUrl, setRepoUrl]       = useState('');
  const [entrypoint, setEntrypoint] = useState('main.py');
  const [name, setName]             = useState('');
  const [description, setDescription] = useState('');
  const [requirements, setRequirements] = useState('');
  const [reqsOpen, setReqsOpen]   = useState(false);
  const [runtime, setRuntime]     = useState('pytorch-cu121');
  const [cpus, setCpus]           = useState(1);
  const [memory, setMemory]       = useState('2g');
  const [dataset, setDataset]     = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [savedFlash, setSavedFlash] = useState(false);
  const datasetRef = useRef(null);
  const fileRef    = useRef(null);

  // Load draft on mount
  useEffect(() => {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.code) setCode(d.code);
        if (d.requirements) { setRequirements(d.requirements); setReqsOpen(true); }
        if (d.runtime) setRuntime(d.runtime);
        if (d.cpus) setCpus(d.cpus);
        if (d.memory) setMemory(d.memory);
      }
    } catch(e) {}
  }, []);

  // Apply prefill from Repeat
  useEffect(() => {
    if (!prefill) return;
    if (prefill.repo_url) {
      setMode('repo');
      setRepoUrl(prefill.repo_url);
      setEntrypoint(prefill.entrypoint || 'main.py');
    } else {
      setMode('paste');
      setCode(prefill.code || '');
    }
    setRuntime(prefill.runtime || 'pytorch-cu121');
    setCpus(prefill.cpus ?? 1);
    setMemory(prefill.memory || '2g');
    setName(prefill.name || '');
    setDescription(prefill.description || '');
    if (prefill.requirements) { setRequirements(prefill.requirements); setReqsOpen(true); }
    if (prefill.has_dataset) {
      setTimeout(() => alert('⚠ До цієї задачі був прикріплений датасет. Прикріпи його заново якщо потрібно.'), 300);
    }
  }, [prefill]);

  // Auto-save draft (debounced)
  useEffect(() => {
    const t = setTimeout(() => {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          code, requirements, runtime, cpus, memory,
          saved_at: new Date().toISOString(),
        }));
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1400);
      } catch(e) {}
    }, 800);
    return () => clearTimeout(t);
  }, [code, requirements, runtime, cpus, memory]);

  const clearDraft = () => {
    if (!confirm('Очистити збережений код і налаштування?')) return;
    localStorage.removeItem(DRAFT_KEY);
    setCode(''); setRequirements(''); setCpus(1); setMemory('2g');
  };

  const loadTemplate = (key) => {
    if (!key) return;
    const tpl = TEMPLATES[key];
    if (!tpl) return;
    if (code.trim() && !confirm('Замінити поточний код шаблоном?')) return;
    setCode(tpl.code);
    if (tpl.runtime) setRuntime(tpl.runtime);
    setMode('paste');
  };

  const submit = async () => {
    // Notification permission on first submit
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    const fd = new FormData();
    if (mode === 'paste') {
      if (!code.trim()) return alert('Введи код');
      fd.append('code', code);
    } else if (mode === 'file') {
      if (!codeFile) return alert('Вибери .py файл');
      fd.append('code_file', codeFile);
    } else if (mode === 'repo') {
      if (!repoUrl.trim()) return alert('Введи URL репозиторію');
      fd.append('repo_url', repoUrl.trim());
      fd.append('entrypoint', entrypoint.trim() || 'main.py');
    }
    fd.append('runtime', runtime);
    fd.append('cpus', cpus);
    fd.append('memory', memory);
    fd.append('student_id', studentId || 'anonymous');
    fd.append('name', name);
    fd.append('description', description);
    if (requirements.trim()) fd.append('requirements', requirements);
    if (dataset) fd.append('dataset', dataset);

    setSubmitting(true);
    try {
      const res  = await fetch('/submit-job-form', { method:'POST', body: fd, headers: apiHeaders(apiKey) });
      const data = await res.json();
      if (!res.ok) {
        alert('Помилка: ' + (data.detail || JSON.stringify(data)));
        return;
      }
      setDataset(null);
      if (datasetRef.current) datasetRef.current.value = '';
      onSubmit(data.job_id);
    } catch(e) {
      alert('Network error: ' + e.message);
    } finally {
      setSubmitting(false);
    }
  };

  const labelStyle = { fontSize:12, color:'#94a3b8', display:'block', marginBottom:6 };
  const sectionLabel = { fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600 };

  return (
    <section style={{
      background:'#1e2130', border:'1px solid #2a3050', borderRadius:10,
      padding:'20px', display:'flex', flexDirection:'column', gap:14,
    }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={sectionLabel}>Submit Job</div>
        <span style={{
          fontSize:11, color:'#4ade80', opacity: savedFlash ? 1 : 0,
          transition:'opacity 0.25s',
        }}>💾 Auto-saved</span>
      </div>

      {/* Mode tabs */}
      <div style={{ display:'flex', gap:0, borderBottom:'1px solid #2a3050' }}>
        {[['paste','Paste Code'], ['file','Upload .py'], ['repo','GitHub / GitLab']].map(([m, label]) => (
          <button key={m} onClick={() => setMode(m)} style={{
            background: mode === m ? '#13172b' : 'transparent',
            color: mode === m ? '#e2e8f0' : '#64748b',
            border:'none', borderBottom: mode === m ? '2px solid #3b82f6' : '2px solid transparent',
            padding:'8px 14px', fontSize:13, fontWeight: mode === m ? 600 : 500,
          }}>{label}</button>
        ))}
      </div>

      {/* Mode-specific input */}
      {mode === 'paste' && (
        <div>
          <div style={{ display:'flex', gap:8, marginBottom:8, alignItems:'center', flexWrap:'wrap' }}>
            <select onChange={e => { loadTemplate(e.target.value); e.target.value = ''; }}
              style={{ padding:'6px 10px', fontSize:12 }}>
              <option value="">— Insert template —</option>
              <option value="hello-gpu">Hello GPU (PyTorch)</option>
              <option value="save-artifact">Save artifact</option>
              <option value="train-mnist">MNIST training</option>
              <option value="use-dataset">Read uploaded dataset</option>
              <option value="hello-tf">Hello GPU (TensorFlow)</option>
            </select>
            <button onClick={clearDraft} style={{
              background:'#1a1f35', color:'#94a3b8', border:'1px solid #2a3050',
              borderRadius:5, padding:'5px 10px', fontSize:11,
            }}>Clear draft</button>
          </div>
          <CodeEditor value={code} onChange={setCode} />
        </div>
      )}

      {mode === 'file' && (
        <div>
          <label style={labelStyle}>Python file (.py — max 200 KB)</label>
          <input ref={fileRef} type="file" accept=".py"
            onChange={e => setCodeFile(e.target.files[0])}
            style={{ width:'100%', padding:'8px 10px' }} />
          {codeFile && (
            <div style={{ fontSize:12, color:'#64748b', marginTop:6 }}>
              📄 {codeFile.name} ({fmtSize(codeFile.size)})
            </div>
          )}
        </div>
      )}

      {mode === 'repo' && (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <div>
            <label style={labelStyle}>Repository URL (HTTPS)</label>
            <input type="url" value={repoUrl} onChange={e => setRepoUrl(e.target.value)}
              placeholder="https://github.com/username/repo"
              style={{ width:'100%', padding:'8px 10px' }} />
          </div>
          <div>
            <label style={labelStyle}>Entrypoint</label>
            <input value={entrypoint} onChange={e => setEntrypoint(e.target.value)}
              style={{ width:200, padding:'8px 10px' }} />
          </div>
        </div>
      )}

      {/* Job name + description */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:10 }}>
        <div>
          <label style={labelStyle}>Job name <span style={{ color:'#475569' }}>(optional)</span></label>
          <input value={name} onChange={e => setName(e.target.value)}
            placeholder="e.g. mnist baseline v3"
            style={{ width:'100%', padding:'8px 10px' }} />
        </div>
        <div>
          <label style={labelStyle}>Description <span style={{ color:'#475569' }}>(optional)</span></label>
          <input value={description} onChange={e => setDescription(e.target.value)}
            placeholder="brief notes about this run"
            style={{ width:'100%', padding:'8px 10px' }} />
        </div>
      </div>

      {/* requirements (collapsible) */}
      <div>
        <div onClick={() => setReqsOpen(!reqsOpen)} style={{
          cursor:'pointer', fontSize:12, color:'#94a3b8', userSelect:'none',
          display:'flex', alignItems:'center', gap:6, padding:'4px 0',
        }}>
          <span style={{ transition:'transform 0.15s', display:'inline-block', transform: reqsOpen ? 'rotate(90deg)' : 'none' }}>▸</span>
          Extra packages (requirements.txt)
        </div>
        {reqsOpen && (
          <div style={{ animation:'fadeIn 0.15s ease' }}>
            <textarea value={requirements} onChange={e => setRequirements(e.target.value)}
              placeholder={`# one package per line, e.g.\ntransformers==4.40.0\ndatasets`}
              style={{ width:'100%', minHeight:80, padding:'10px 12px', fontFamily:'monospace' }} />
            <div style={{ fontSize:11, color:'#64748b', marginTop:4 }}>
              ⚠ Якщо є requirements — задача отримає bridge-мережу для pip install (інакше: <code style={{ color:'#94a3b8' }}>--network none</code>).
            </div>
          </div>
        )}
      </div>

      {/* Runtime + CPUs + Memory + Student */}
      <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1.5fr', gap:10 }}>
        <div>
          <label style={labelStyle}>Runtime</label>
          <select value={runtime} onChange={e => setRuntime(e.target.value)}
            style={{ width:'100%', padding:'8px 10px' }}>
            {Object.entries(runtimes || {}).map(([k, v]) => (
              <option key={k} value={k}>{k} ({v.split(':')[0].split('/').pop()})</option>
            ))}
          </select>
        </div>
        <div>
          <label style={labelStyle}>CPUs</label>
          <input type="number" min={0.1} max={8} step={0.1} value={cpus}
            onChange={e => setCpus(Number(e.target.value))}
            style={{ width:'100%', padding:'8px 10px' }} />
        </div>
        <div>
          <label style={labelStyle}>Memory</label>
          <input value={memory} onChange={e => setMemory(e.target.value)}
            placeholder="2g"
            style={{ width:'100%', padding:'8px 10px' }} />
        </div>
        <div>
          <label style={labelStyle}>Student ID</label>
          <input value={studentId} onChange={e => onStudentIdChange(e.target.value)}
            placeholder="anonymous"
            style={{ width:'100%', padding:'8px 10px' }} />
        </div>
      </div>

      {/* Dataset */}
      <div>
        <label style={labelStyle}>Dataset <span style={{ color:'#475569' }}>(optional .zip — max 500 MB)</span></label>
        <input ref={datasetRef} type="file" accept=".zip"
          onChange={e => setDataset(e.target.files[0])}
          style={{ width:'100%', padding:'8px 10px' }} />
        {dataset && (
          <div style={{ fontSize:12, color:'#64748b', marginTop:6 }}>
            🗜 {dataset.name} ({fmtSize(dataset.size)})
          </div>
        )}
      </div>

      <button onClick={submit} disabled={submitting} style={{
        background: submitting ? '#1e3a5f' : '#3b82f6', color:'#fff',
        border:'none', borderRadius:7, padding:'10px 20px', fontSize:14, fontWeight:600,
        display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        opacity: submitting ? 0.7 : 1, transition:'background 0.15s',
      }}>
        {submitting ? <><Spinner size={14}/> Submitting…</> : '⚡ Submit Job'}
      </button>
    </section>
  );
}

// ─── Jobs Table ──────────────────────────────────────────────────────────────
function JobsTable({ jobs, selectedId, studentId, onSelect, onCancel, onRepeat }) {
  const [filterMine, setFilterMine] = useState(true);

  const visible = filterMine
    ? jobs.filter(j => (j.student_id || 'anonymous') === (studentId || 'anonymous'))
    : jobs;

  return (
    <section style={{ background:'#1e2130', border:'1px solid #2a3050', borderRadius:10, overflow:'hidden' }}>
      <div style={{ padding:'14px 20px', borderBottom:'1px solid #2a3050', display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
        <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600 }}>Jobs</div>
        <div style={{ display:'flex', alignItems:'center', gap:14, flexWrap:'wrap' }}>
          <label style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, color:'#94a3b8', cursor:'pointer' }}>
            <input type="checkbox" checked={filterMine} onChange={e => setFilterMine(e.target.checked)} style={{ accentColor:'#3b82f6' }}/>
            only my jobs
          </label>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ width:8, height:8, borderRadius:'50%', background:'#4ade80', animation:'pulse 2s infinite' }}/>
            <span style={{ fontSize:11, color:'#64748b' }}>Live · 2s</span>
          </div>
        </div>
      </div>
      <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead>
            <tr style={{ borderBottom:'1px solid #2a3050' }}>
              {['Job','Status','GPU','Runtime','Student','Created','Action'].map(h => (
                <th key={h} style={{ textAlign:'left', padding:'8px 12px', fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.06em', fontWeight:600 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {visible.length === 0 && (
              <tr><td colSpan={7} style={{ textAlign:'center', padding:30, color:'#475569', fontSize:13 }}>
                {filterMine ? 'У тебе ще немає задач. Зніми галочку щоб побачити всі.' : 'Немає задач.'}
              </td></tr>
            )}
            {visible.map(job => (
              <tr key={job.job_id}
                onClick={() => onSelect(job.job_id)}
                style={{
                  borderBottom:'1px solid #1a1f35',
                  cursor:'pointer',
                  background: selectedId === job.job_id ? '#1a2540' : 'transparent',
                }}
                onMouseEnter={e => { if (selectedId !== job.job_id) e.currentTarget.style.background='#161c2e'; }}
                onMouseLeave={e => { if (selectedId !== job.job_id) e.currentTarget.style.background='transparent'; }}
              >
                <td style={{ padding:'10px 12px', fontWeight:500 }}>
                  {job.name ? (
                    <>
                      <div>{job.name}</div>
                      <div style={{ fontSize:11, color:'#64748b', fontFamily:'monospace' }}>
                        {job.job_id.substring(0,8)}{job.description ? ' · ' + job.description : ''}
                      </div>
                    </>
                  ) : (
                    <span style={{ fontFamily:'monospace' }}>{job.job_id.substring(0,12)}…</span>
                  )}
                </td>
                <td style={{ padding:'10px 12px' }}><Badge status={job.status}/></td>
                <td style={{ padding:'10px 12px', color:'#94a3b8', fontSize:12 }}>{job.gpu_id ?? '—'}</td>
                <td style={{ padding:'10px 12px', color:'#64748b', fontSize:12, fontFamily:'monospace' }}>{job.runtime}</td>
                <td style={{ padding:'10px 12px', color:'#94a3b8', fontSize:12 }}>{job.student_id || '—'}</td>
                <td style={{ padding:'10px 12px', color:'#64748b', fontSize:12 }}>
                  {new Date(job.created_at).toLocaleTimeString()}
                </td>
                <td style={{ padding:'10px 12px' }}>
                  {['queued','running'].includes(job.status) ? (
                    <button onClick={e => { e.stopPropagation(); onCancel(job.job_id); }} style={{
                      background:'#2d0f0f', color:'#f87171', border:'1px solid #7f1d1d',
                      borderRadius:5, padding:'3px 8px', fontSize:11,
                    }}>Cancel</button>
                  ) : (
                    <button onClick={e => { e.stopPropagation(); onRepeat(job); }} style={{
                      background:'#1e2d4a', color:'#60a5fa', border:'1px solid #1e3a5f',
                      borderRadius:5, padding:'3px 8px', fontSize:11,
                    }}>↻ Repeat</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </section>
  );
}

// ─── Root Dashboard ──────────────────────────────────────────────────────────
function Dashboard() {
  const [cluster, setCluster] = useState(null);
  const [gpus, setGpus]       = useState([]);
  const [jobs, setJobs]       = useState([]);
  const [runtimes, setRuntimes] = useState({});
  const [selectedJobId, setSelectedJobId] = useState(null);
  const [prefill, setPrefill] = useState(null);
  const [apiKey, setApiKey]   = useState(localStorage.getItem('api_key') || '');
  const [apiKeyDraft, setApiKeyDraft] = useState(localStorage.getItem('api_key') || '');
  const [studentId, setStudentId]     = useState(localStorage.getItem('student_id') || '');
  const lastStatusRef = useRef({});

  const refresh = useCallback(async () => {
    try {
      const [c, g, j] = await Promise.all([
        fetch('/cluster-status').then(r => r.json()),
        fetch('/gpus').then(r => r.json()),
        fetch('/jobs').then(r => r.json()),
      ]);
      setCluster(c); setGpus(g.gpus || []); setJobs(j.jobs || []);

      // Browser notifications for status changes (only own jobs)
      if ('Notification' in window && Notification.permission === 'granted') {
        const myStudent = studentId || 'anonymous';
        for (const job of j.jobs || []) {
          const prev = lastStatusRef.current[job.job_id];
          const terminal = ['completed','failed','cancelled'];
          if (prev && !terminal.includes(prev) && terminal.includes(job.status)
              && (job.student_id || 'anonymous') === myStudent) {
            const icon = job.status === 'completed' ? '✓' : (job.status === 'failed' ? '✗' : '✕');
            const label = job.name || job.job_id.substring(0,8);
            const dur = (job.started_at && job.finished_at)
              ? ` in ${fmtDuration((new Date(job.finished_at) - new Date(job.started_at))/1000)}`
              : '';
            const n = new Notification(`${icon} ${label} — ${job.status}`, {
              body: `Finished${dur}`, tag: job.job_id,
            });
            n.onclick = () => { window.focus(); setSelectedJobId(job.job_id); n.close(); };
          }
          lastStatusRef.current[job.job_id] = job.status;
        }
      }
    } catch(e) { console.error('refresh failed', e); }
  }, [studentId]);

  useEffect(() => {
    fetch('/runtimes').then(r => r.json()).then(d => setRuntimes(d.runtimes || {}));
    refresh();
    const iv = setInterval(refresh, POLL_MS);
    return () => clearInterval(iv);
  }, [refresh]);

  useEffect(() => { localStorage.setItem('student_id', studentId); }, [studentId]);

  const saveApiKey = () => {
    localStorage.setItem('api_key', apiKeyDraft);
    setApiKey(apiKeyDraft);
  };
  const clearApiKey = () => {
    localStorage.removeItem('api_key');
    setApiKey(''); setApiKeyDraft('');
  };

  const cancelJob = async (jobId) => {
    await fetch(`/jobs/${jobId}/cancel`, { method:'POST' });
    refresh();
  };
  const repeatJob = (job) => { setPrefill(job); window.scrollTo({ top: 0, behavior:'smooth' }); };
  const cleanup   = async () => {
    const r = await fetch('/jobs/cleanup', { method:'DELETE' });
    const d = await r.json();
    alert(`Видалено ${d.removed_jobs} завершених задач`);
    refresh();
  };

  const stats = cluster ? {
    gpu_total: cluster.gpu_summary.total,
    gpu_idle:  cluster.gpu_summary.idle,
    gpu_busy:  cluster.gpu_summary.busy,
    queued:    cluster.job_summary.queued,
    running:   cluster.job_summary.running,
    completed: cluster.job_summary.completed,
  } : { gpu_total:0, gpu_idle:0, gpu_busy:0, queued:0, running:0, completed:0 };

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <header style={{
        background:'#13172b', borderBottom:'1px solid #2a3050',
        padding:'0 24px', height:56, display:'flex', alignItems:'center', gap:20,
        position:'sticky', top:0, zIndex:100,
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{
            width:28, height:28, background:'linear-gradient(135deg,#3b82f6,#8b5cf6)',
            borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center', fontSize:14,
          }}>⚡</div>
          <span style={{ fontWeight:700, fontSize:16, letterSpacing:'-0.02em' }}>GPU Job Scheduler</span>
        </div>
        <div style={{ width:1, height:24, background:'#2a3050' }}/>
        <a href="/admin" style={{ color:'#60a5fa', textDecoration:'none', fontSize:13, fontWeight:500 }}>Admin Panel →</a>
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
          <input value={apiKeyDraft} onChange={e => setApiKeyDraft(e.target.value)}
            type="password" placeholder="API Key (optional)" autoComplete="off"
            style={{ padding:'6px 10px', width:200, fontSize:12, fontFamily:'monospace' }}/>
          <button onClick={saveApiKey} style={{
            background: apiKey === apiKeyDraft && apiKey ? '#0f2e1a' : '#1e3a5f',
            color: apiKey === apiKeyDraft && apiKey ? '#4ade80' : '#60a5fa',
            border:`1px solid ${apiKey === apiKeyDraft && apiKey ? '#166534' : '#1e40af'}`,
            borderRadius:6, padding:'6px 12px', fontSize:12,
          }}>{apiKey === apiKeyDraft && apiKey ? '✓ Saved' : 'Save'}</button>
          <button onClick={clearApiKey} style={{
            background:'#1a1f35', color:'#94a3b8', border:'1px solid #2a3050',
            borderRadius:6, padding:'6px 10px', fontSize:12,
          }}>Clear</button>
        </div>
      </header>

      <main style={{ flex:1, padding:'24px', maxWidth:1400, margin:'0 auto', width:'100%' }}>

        {/* Stats Row */}
        <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:20 }}>
          <StatCard label="GPU Total"  value={stats.gpu_total} />
          <StatCard label="GPU Idle"   value={stats.gpu_idle}  color="#4ade80" />
          <StatCard label="GPU Busy"   value={stats.gpu_busy}  color="#fb923c" />
          <StatCard label="In Queue"   value={stats.queued}    color="#60a5fa" />
          <StatCard label="Running"    value={stats.running}   color="#fb923c" />
          <StatCard label="Completed"  value={stats.completed} color="#4ade80" />
        </div>

        {/* GPU Status */}
        <section style={{
          background:'#1e2130', border:'1px solid #2a3050', borderRadius:10,
          padding:'16px 20px', marginBottom:20,
        }}>
          <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:12, fontWeight:600 }}>GPU Status</div>
          <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
            {gpus.length === 0
              ? <div style={{ color:'#475569', fontSize:13 }}>Loading…</div>
              : gpus.map(g => <GpuChip key={g.gpu_id} gpu={g}/>)}
          </div>
        </section>

        {/* Two-column: Submit + Output */}
        <div style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) minmax(0,1fr)', gap:20, marginBottom:20 }}>
          <SubmitForm
            runtimes={runtimes}
            apiKey={apiKey}
            studentId={studentId}
            onStudentIdChange={setStudentId}
            onSubmit={(jid) => { setSelectedJobId(jid); refresh(); }}
            prefill={prefill}
          />
          {selectedJobId ? (
            <OutputPanel jobId={selectedJobId} apiKey={apiKey} onClose={() => setSelectedJobId(null)}/>
          ) : (
            <div style={{
              background:'#141824', border:'1px dashed #2a3050', borderRadius:10,
              display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
              gap:8, minHeight:300, color:'#3b4465', padding:30,
            }}>
              <span style={{ fontSize:36 }}>▶</span>
              <span style={{ fontSize:13 }}>Submit a job or click a row below to see output</span>
            </div>
          )}
        </div>

        {/* Cleanup button */}
        <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:12 }}>
          <button onClick={cleanup} style={{
            background:'#1a1f35', color:'#94a3b8', border:'1px solid #2a3050',
            borderRadius:6, padding:'6px 12px', fontSize:12,
          }}>🗑 Clean finished jobs</button>
        </div>

        {/* Jobs Table */}
        <JobsTable
          jobs={jobs}
          selectedId={selectedJobId}
          studentId={studentId}
          onSelect={setSelectedJobId}
          onCancel={cancelJob}
          onRepeat={repeatJob}
        />

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
{% endraw %}
</script>
</body>
