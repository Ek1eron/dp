<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · GPU Job Scheduler</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #1e2130; }
  ::-webkit-scrollbar-thumb { background: #3b4465; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4b5585; }

  textarea, input, select {
    background: #1a1f35; border: 1px solid #2a3050; border-radius: 6px;
    color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  textarea:focus, input:focus, select:focus { border-color: #3b82f6; }
  input::placeholder { color: #4a5580; }
  button { cursor: pointer; font-family: 'Segoe UI', system-ui, sans-serif; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

const fmt = s => {
  if (s == null) return '—';
  if (s >= 3600) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
  if (s >= 60)   return `${Math.floor(s/60)}m ${Math.floor(s%60)}s`;
  return `${Math.round(s)}s`;
};

const adminHeaders = (key) => ({ 'X-Admin-Key': key });

function Spinner({ size=14 }) {
  return <span style={{
    display:'inline-block', width:size, height:size,
    border:'2px solid #2a3050', borderTopColor:'#3b82f6',
    borderRadius:'50%', animation:'spin 0.7s linear infinite', flexShrink:0,
  }}/>;
}

function Badge({ status }) {
  const cfg = {
    queued:    { bg:'#1e3a5f', color:'#60a5fa', label:'QUEUED' },
    running:   { bg:'#3d2200', color:'#fb923c', label:'RUNNING' },
    completed: { bg:'#0f2e1a', color:'#4ade80', label:'COMPLETED' },
    failed:    { bg:'#2d0f0f', color:'#f87171', label:'FAILED' },
    cancelled: { bg:'#1e1e2e', color:'#94a3b8', label:'CANCELLED' },
  };
  const c = cfg[status] || cfg.queued;
  return <span style={{
    background:c.bg, color:c.color, border:`1px solid ${c.color}33`,
    borderRadius:4, padding:'2px 8px', fontSize:11, fontWeight:700,
    letterSpacing:'0.05em', whiteSpace:'nowrap',
  }}>{c.label}</span>;
}

function StatCard({ label, value, sub, color }) {
  return (
    <div style={{
      background:'#1e2130', border:'1px solid #2a3050', borderRadius:10,
      padding:'18px 22px', flex:1, minWidth:140,
    }}>
      <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>{label}</div>
      <div style={{ fontSize:30, fontWeight:700, color: color || '#e2e8f0', lineHeight:1 }}>{value}</div>
      {sub && <div style={{ fontSize:12, color:'#475569', marginTop:4 }}>{sub}</div>}
    </div>
  );
}

// ─── Bar chart for runtime usage ────────────────────────────────────────────
const RUNTIME_COLORS = {
  'pytorch-cu121': '#3b82f6',
  'pytorch-cu118': '#8b5cf6',
  'tensorflow':    '#f97316',
};

function RuntimeBars({ usage }) {
  const entries = Object.entries(usage);
  const total = entries.reduce((s, [_, c]) => s + c, 0);
  if (!total) return <div style={{ color:'#475569', fontSize:13 }}>No data yet.</div>;
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
      {entries.sort((a,b) => b[1]-a[1]).map(([name, count]) => {
        const pct   = (count/total)*100;
        const color = RUNTIME_COLORS[name] || '#64748b';
        return (
          <div key={name} style={{ display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ width:140, fontSize:12, color:'#94a3b8', fontFamily:'monospace', textAlign:'right', flexShrink:0 }}>{name}</div>
            <div style={{ flex:1, background:'#141824', borderRadius:4, height:22, overflow:'hidden' }}>
              <div style={{
                width:`${pct}%`, height:'100%', background:color, borderRadius:4,
                transition:'width 0.8s cubic-bezier(.4,0,.2,1)',
                display:'flex', alignItems:'center', paddingLeft:8,
              }}>
                <span style={{ fontSize:11, fontWeight:600, color:'#fff', whiteSpace:'nowrap' }}>{count} jobs</span>
              </div>
            </div>
            <div style={{ width:42, textAlign:'right', fontSize:12, color:'#64748b', flexShrink:0 }}>{pct.toFixed(0)}%</div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Password Gate ───────────────────────────────────────────────────────────
function PasswordGate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const attempt = async () => {
    if (!pw.trim()) return;
    setBusy(true); setError('');
    try {
      const res = await fetch('/admin/check', { headers: adminHeaders(pw) });
      if (res.ok) {
        onUnlock(pw);
      } else if (res.status === 503) {
        setError('Admin вимкнений (ADMIN_API_KEY не заданий у .env)');
      } else {
        setError('Невірний admin key');
      }
    } catch(e) {
      setError('Network error: ' + e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#0f1117' }}>
      <div style={{
        background:'#1e2130', border:'1px solid #2a3050', borderRadius:14,
        padding:'40px 48px', width:400, animation:'fadeIn 0.3s ease',
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:24 }}>
          <div style={{
            width:36, height:36, background:'linear-gradient(135deg,#3b82f6,#8b5cf6)',
            borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18,
          }}>🔒</div>
          <div>
            <div style={{ fontWeight:700, fontSize:16 }}>Admin Panel</div>
            <div style={{ fontSize:12, color:'#64748b' }}>GPU Job Scheduler</div>
          </div>
        </div>
        <div style={{ marginBottom:16 }}>
          <label style={{ fontSize:12, color:'#94a3b8', display:'block', marginBottom:6 }}>Admin API Key</label>
          <input type="password" value={pw} autoFocus
            onChange={e => { setPw(e.target.value); setError(''); }}
            onKeyDown={e => e.key === 'Enter' && attempt()}
            placeholder="paste from .env"
            style={{
              width:'100%', padding:'10px 12px', fontSize:14, fontFamily:'monospace',
              borderColor: error ? '#f87171' : '#2a3050',
            }}/>
          {error && <div style={{ fontSize:12, color:'#f87171', marginTop:6 }}>{error}</div>}
        </div>
        <button onClick={attempt} disabled={busy} style={{
          width:'100%', background:'#3b82f6', color:'#fff', border:'none',
          borderRadius:7, padding:'10px', fontSize:14, fontWeight:600,
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          opacity: busy ? 0.7 : 1,
        }}>
          {busy ? <><Spinner size={14}/> Checking…</> : 'Unlock'}
        </button>
        <div style={{ textAlign:'center', marginTop:16 }}>
          <a href="/" style={{ color:'#64748b', fontSize:12, textDecoration:'none' }}>← Back to Dashboard</a>
        </div>
      </div>
    </div>
  );
}

// ─── API Keys panel ──────────────────────────────────────────────────────────
function ApiKeysSection({ adminKey, onChange }) {
  const [keys, setKeys]   = useState([]);
  const [newSid, setNewSid] = useState('');
  const [newName, setNewName] = useState('');
  const [busy, setBusy]   = useState(false);
  const [copied, setCopied] = useState(null);

  const refresh = async () => {
    try {
      const r = await fetch('/admin/keys', { headers: adminHeaders(adminKey) });
      const d = await r.json();
      setKeys(d.keys || []);
    } catch(e) {}
  };
  useEffect(() => { refresh(); }, [adminKey]);

  const generate = async () => {
    if (!newSid.trim()) return;
    setBusy(true);
    try {
      const r = await fetch('/admin/keys', {
        method:'POST',
        headers: { ...adminHeaders(adminKey), 'Content-Type':'application/json' },
        body: JSON.stringify({ student_id: newSid.trim(), name: newName.trim() }),
      });
      const d = await r.json();
      if (!r.ok) { alert('Error: ' + (d.detail || 'failed')); return; }
      // Auto-copy new key
      navigator.clipboard?.writeText(d.api_key).catch(() => {});
      setNewSid(''); setNewName('');
      refresh();
    } finally { setBusy(false); }
  };

  const revoke = async (key) => {
    if (!confirm(`Відкликати ключ ${key.substring(0,16)}…?`)) return;
    await fetch(`/admin/keys/${encodeURIComponent(key)}`, {
      method:'DELETE', headers: adminHeaders(adminKey),
    });
    refresh();
  };

  const copy = (key) => {
    navigator.clipboard?.writeText(key).catch(() => {});
    setCopied(key);
    setTimeout(() => setCopied(null), 1800);
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
      {/* Generate form */}
      <div style={{ background:'#141824', border:'1px solid #2a3050', borderRadius:8, padding:16 }}>
        <div style={{ fontSize:11, color:'#64748b', marginBottom:10, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>Generate New Key</div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <input value={newSid} onChange={e => setNewSid(e.target.value)}
            placeholder="Student ID (e.g. ivan_petrenko)"
            style={{ flex:'1 1 180px', padding:'8px 10px' }}/>
          <input value={newName} onChange={e => setNewName(e.target.value)}
            placeholder="Display name (optional)"
            style={{ flex:'1 1 180px', padding:'8px 10px' }}/>
          <button onClick={generate} disabled={!newSid.trim() || busy} style={{
            background:'#3b82f6', color:'#fff', border:'none', borderRadius:6,
            padding:'8px 16px', fontSize:13, fontWeight:600,
            opacity: !newSid.trim() ? 0.5 : 1, whiteSpace:'nowrap',
          }}>
            {busy ? <Spinner size={14}/> : '+ Generate Key'}
          </button>
        </div>
        <div style={{ fontSize:11, color:'#64748b', marginTop:8 }}>
          Новий ключ автоматично копіюється в буфер. Передай студенту через email/Telegram.
        </div>
      </div>

      {/* List */}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {keys.length === 0 && <div style={{ textAlign:'center', padding:30, color:'#475569' }}>Немає виданих ключів</div>}
        {keys.map(k => (
          <div key={k.api_key} style={{
            background:'#141824', border:'1px solid #2a3050', borderRadius:8,
            padding:'12px 16px', display:'flex', alignItems:'center', gap:12, flexWrap:'wrap',
          }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontWeight:600, fontSize:13 }}>
                {k.name || k.student_id}
                <span style={{ marginLeft:8, fontSize:11, color:'#64748b' }}>({k.student_id})</span>
              </div>
              <div style={{ fontFamily:'monospace', fontSize:11, color:'#60a5fa', marginTop:3, wordBreak:'break-all' }}>
                {k.api_key}
              </div>
              <div style={{ fontSize:11, color:'#475569', marginTop:3 }}>
                Created {new Date(k.created_at).toLocaleString()}
              </div>
            </div>
            <div style={{ display:'flex', gap:6, flexShrink:0 }}>
              <button onClick={() => copy(k.api_key)} style={{
                background: copied === k.api_key ? '#0f2e1a' : '#1e2130',
                color: copied === k.api_key ? '#4ade80' : '#94a3b8',
                border:`1px solid ${copied === k.api_key ? '#166534' : '#2a3050'}`,
                borderRadius:5, padding:'5px 10px', fontSize:12,
              }}>{copied === k.api_key ? '✓ Copied' : '⧉ Copy'}</button>
              <button onClick={() => revoke(k.api_key)} style={{
                background:'#2d0f0f', color:'#f87171', border:'1px solid #7f1d1d',
                borderRadius:5, padding:'5px 10px', fontSize:12,
              }}>Revoke</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Admin Panel Root ────────────────────────────────────────────────────────
function AdminPanel({ adminKey, onLogout }) {
  const [tab, setTab]     = useState('overview');
  const [stats, setStats] = useState(null);
  const [allJobs, setAllJobs] = useState([]);

  const refresh = useCallback(async () => {
    try {
      const [s, j] = await Promise.all([
        fetch('/admin/stats', { headers: adminHeaders(adminKey) }).then(r => r.json()),
        fetch('/jobs').then(r => r.json()),
      ]);
      setStats(s);
      setAllJobs((j.jobs || []).slice(0, 50));
    } catch(e) {}
  }, [adminKey]);

  useEffect(() => {
    refresh();
    const iv = setInterval(refresh, 5000);
    return () => clearInterval(iv);
  }, [refresh]);

  const forceKill = async (jobId) => {
    if (!confirm(`Force kill задачу ${jobId.substring(0,8)}?`)) return;
    await fetch(`/admin/jobs/${jobId}/kill`, {
      method:'POST', headers: adminHeaders(adminKey),
    });
    refresh();
  };

  const tabs = [
    ['overview',  'Overview'],
    ['students',  'Students'],
    ['runtimes',  'Runtimes'],
    ['api-keys',  'API Keys'],
    ['all-jobs',  'All Jobs'],
  ];

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <header style={{
        background:'#13172b', borderBottom:'1px solid #2a3050',
        padding:'0 24px', height:56, display:'flex', alignItems:'center', gap:20,
        position:'sticky', top:0, zIndex:100,
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{
            width:28, height:28, background:'linear-gradient(135deg,#3b82f6,#8b5cf6)',
            borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center', fontSize:14,
          }}></div>
          <span style={{ fontWeight:700, fontSize:16, letterSpacing:'-0.02em' }}>GPU Job Scheduler</span>
          <span style={{
            background:'#7c2d12', color:'#fed7aa', borderRadius:5,
            padding:'2px 8px', fontSize:11, marginLeft:4, fontWeight:700, letterSpacing:'0.05em',
          }}>ADMIN</span>
        </div>
        <div style={{ marginLeft:'auto', display:'flex', gap:16, alignItems:'center' }}>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:8, height:8, borderRadius:'50%', background:'#4ade80', animation:'pulse 2s infinite' }}/>
            <span style={{ fontSize:12, color:'#64748b' }}>Live · 5s</span>
          </div>
          <a href="/" style={{ color:'#60a5fa', textDecoration:'none', fontSize:13 }}>← Dashboard</a>
          <button onClick={onLogout} style={{
            background:'#2d0f0f', color:'#f87171', border:'1px solid #7f1d1d',
            borderRadius:6, padding:'6px 12px', fontSize:12,
          }}>Logout</button>
        </div>
      </header>

      {/* Tabs */}
      <div style={{ background:'#13172b', borderBottom:'1px solid #2a3050', padding:'0 24px', display:'flex', gap:0, overflowX:'auto' }}>
        {tabs.map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} style={{
            background:'none', border:'none',
            borderBottom: tab === id ? '2px solid #3b82f6' : '2px solid transparent',
            color: tab === id ? '#e2e8f0' : '#64748b',
            padding:'12px 16px', fontSize:13, fontWeight: tab === id ? 600 : 400,
            whiteSpace:'nowrap',
          }}>{label}</button>
        ))}
      </div>

      <main style={{ flex:1, padding:'24px', maxWidth:1400, margin:'0 auto', width:'100%' }}>
        {!stats ? (
          <div style={{ textAlign:'center', padding:60, color:'#64748b' }}>
            <Spinner /> <span style={{ marginLeft:10 }}>Loading…</span>
          </div>
        ) : (
          <>
            {/* Overview */}
            {tab === 'overview' && (
              <div style={{ display:'flex', flexDirection:'column', gap:20, animation:'fadeIn 0.2s ease' }}>
                <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
                  <StatCard label="Students"    value={stats.overview.total_students} />
                  <StatCard label="Total Jobs"  value={stats.overview.total_jobs} color="#60a5fa" />
                  <StatCard label="Completed"   value={stats.overview.completed_jobs} color="#4ade80"
                    sub={stats.overview.total_jobs > 0
                      ? `${Math.round(stats.overview.completed_jobs / stats.overview.total_jobs * 100)}% success`
                      : null}/>
                  <StatCard label="Avg Time"    value={fmt(stats.overview.avg_execution_seconds)} color="#fb923c" sub="per completed job"/>
                  <StatCard label="Longest Run" value={fmt(stats.overview.longest_job_seconds)} />
                </div>

                {/* Quick student summary */}
                <section style={{ background:'#1e2130', border:'1px solid #2a3050', borderRadius:10, overflow:'hidden' }}>
                  <div style={{ padding:'14px 20px', borderBottom:'1px solid #2a3050', fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600 }}>
                    Top Students
                  </div>
                  <table style={{ width:'100%', borderCollapse:'collapse' }}>
                    <thead>
                      <tr style={{ borderBottom:'1px solid #2a3050' }}>
                        {['Student','Jobs','Completed','Failed','GPU Hours','Success Rate'].map(h => (
                          <th key={h} style={{ textAlign:'left', padding:'8px 16px', fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.06em', fontWeight:600 }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {stats.students.slice(0, 10).map(s => {
                        const rate = s.total > 0 ? Math.round(s.completed / s.total * 100) : 0;
                        return (
                          <tr key={s.student_id} style={{ borderBottom:'1px solid #1a1f35' }}>
                            <td style={{ padding:'10px 16px', fontWeight:500 }}>{s.student_id}</td>
                            <td style={{ padding:'10px 16px' }}>{s.total}</td>
                            <td style={{ padding:'10px 16px', color:'#4ade80' }}>{s.completed}</td>
                            <td style={{ padding:'10px 16px', color: s.failed > 0 ? '#f87171' : '#64748b' }}>{s.failed}</td>
                            <td style={{ padding:'10px 16px', color:'#fb923c' }}>{(s.total_gpu_time_seconds/3600).toFixed(2)}h</td>
                            <td style={{ padding:'10px 16px' }}>
                              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                                <div style={{ flex:1, background:'#141824', borderRadius:3, height:6, overflow:'hidden', minWidth:60 }}>
                                  <div style={{ width:`${rate}%`, height:'100%', background:'#4ade80', borderRadius:3 }}/>
                                </div>
                                <span style={{ fontSize:12, color:'#94a3b8', width:34, textAlign:'right' }}>{rate}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </section>
              </div>
            )}

            {/* Students */}
            {tab === 'students' && (
              <section style={{ background:'#1e2130', border:'1px solid #2a3050', borderRadius:10, overflow:'hidden', animation:'fadeIn 0.2s ease' }}>
                <div style={{ padding:'14px 20px', borderBottom:'1px solid #2a3050', fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600 }}>
                  Per-Student Statistics
                </div>
                <div style={{ overflowX:'auto' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse' }}>
                    <thead>
                      <tr style={{ borderBottom:'1px solid #2a3050' }}>
                        {['Student','Total','Completed','Failed','Cancelled','Active','GPU Time'].map(h => (
                          <th key={h} style={{ textAlign:'left', padding:'8px 16px', fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.06em', fontWeight:600 }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {stats.students.length === 0 && (
                        <tr><td colSpan={7} style={{ textAlign:'center', padding:30, color:'#475569' }}>Ще немає задач</td></tr>
                      )}
                      {stats.students.map(s => (
                        <tr key={s.student_id} style={{ borderBottom:'1px solid #1a1f35' }}>
                          <td style={{ padding:'12px 16px' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                              <div style={{
                                width:32, height:32, borderRadius:'50%', flexShrink:0,
                                background:`hsl(${(s.student_id.charCodeAt(0)*37) % 360}, 60%, 35%)`,
                                display:'flex', alignItems:'center', justifyContent:'center',
                                fontSize:13, fontWeight:700,
                              }}>{(s.student_id[0] || '?').toUpperCase()}</div>
                              <div style={{ fontWeight:500 }}>{s.student_id}</div>
                            </div>
                          </td>
                          <td style={{ padding:'12px 16px', fontWeight:600 }}>{s.total}</td>
                          <td style={{ padding:'12px 16px', color:'#4ade80', fontWeight:500 }}>{s.completed}</td>
                          <td style={{ padding:'12px 16px', color: s.failed > 0 ? '#f87171' : '#64748b' }}>{s.failed}</td>
                          <td style={{ padding:'12px 16px', color:'#64748b' }}>{s.cancelled}</td>
                          <td style={{ padding:'12px 16px', color:'#fb923c' }}>{s.queued + s.running}</td>
                          <td style={{ padding:'12px 16px', color:'#fb923c', fontWeight:500 }}>{(s.total_gpu_time_seconds/3600).toFixed(2)}h</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {/* Runtimes */}
            {tab === 'runtimes' && (
              <div style={{ display:'flex', flexDirection:'column', gap:20, animation:'fadeIn 0.2s ease' }}>
                <section style={{ background:'#1e2130', border:'1px solid #2a3050', borderRadius:10, padding:'20px 24px' }}>
                  <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600, marginBottom:20 }}>
                    Runtime Profile Usage
                  </div>
                  <RuntimeBars usage={stats.runtime_usage}/>
                </section>
                <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
                  {Object.entries(stats.runtime_usage).map(([name, count]) => (
                    <div key={name} style={{
                      background:'#1e2130', border:'1px solid #2a3050', borderRadius:8,
                      padding:'14px 18px', flex:1, minWidth:160,
                    }}>
                      <div style={{ fontSize:11, color:'#64748b', marginBottom:6, fontFamily:'monospace' }}>{name}</div>
                      <div style={{ fontSize:24, fontWeight:700, color: RUNTIME_COLORS[name] || '#64748b' }}>{count}</div>
                      <div style={{ fontSize:11, color:'#475569', marginTop:2 }}>jobs total</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* API Keys */}
            {tab === 'api-keys' && (
              <section style={{ background:'#1e2130', border:'1px solid #2a3050', borderRadius:10, padding:'20px 24px', animation:'fadeIn 0.2s ease' }}>
                <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600, marginBottom:16 }}>
                  API Key Management
                </div>
                <ApiKeysSection adminKey={adminKey}/>
              </section>
            )}

            {/* All Jobs */}
            {tab === 'all-jobs' && (
              <section style={{ background:'#1e2130', border:'1px solid #2a3050', borderRadius:10, overflow:'hidden', animation:'fadeIn 0.2s ease' }}>
                <div style={{ padding:'14px 20px', borderBottom:'1px solid #2a3050', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                  <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600 }}>
                    All Jobs <span style={{ color:'#475569', textTransform:'none', letterSpacing:0, fontWeight:400 }}>(latest 50)</span>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <span style={{ width:8, height:8, borderRadius:'50%', background:'#4ade80', animation:'pulse 2s infinite' }}/>
                    <span style={{ fontSize:11, color:'#64748b' }}>Live</span>
                  </div>
                </div>
                <div style={{ overflowX:'auto' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse' }}>
                    <thead>
                      <tr style={{ borderBottom:'1px solid #2a3050' }}>
                        {['Job','Student','Status','GPU','Runtime','Created','Action'].map(h => (
                          <th key={h} style={{ textAlign:'left', padding:'8px 12px', fontSize:11, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.06em', fontWeight:600 }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {allJobs.length === 0 && (
                        <tr><td colSpan={7} style={{ textAlign:'center', padding:30, color:'#475569' }}>Немає задач</td></tr>
                      )}
                      {allJobs.map(j => (
                        <tr key={j.job_id} style={{ borderBottom:'1px solid #1a1f35' }}>
                          <td style={{ padding:'10px 12px', fontWeight:500 }}>
                            {j.name ? (
                              <>
                                <div>{j.name}</div>
                                <div style={{ fontSize:11, color:'#64748b', fontFamily:'monospace' }}>{j.job_id.substring(0,8)}</div>
                              </>
                            ) : <span style={{ fontFamily:'monospace' }}>{j.job_id.substring(0,12)}…</span>}
                          </td>
                          <td style={{ padding:'10px 12px', color:'#94a3b8', fontSize:12 }}>{j.student_id || '—'}</td>
                          <td style={{ padding:'10px 12px' }}><Badge status={j.status}/></td>
                          <td style={{ padding:'10px 12px', color:'#94a3b8', fontSize:12 }}>{j.gpu_id ?? '—'}</td>
                          <td style={{ padding:'10px 12px', color:'#64748b', fontSize:12, fontFamily:'monospace' }}>{j.runtime}</td>
                          <td style={{ padding:'10px 12px', color:'#475569', fontSize:11 }}>{new Date(j.created_at).toLocaleString()}</td>
                          <td style={{ padding:'10px 12px' }}>
                            {['queued','running'].includes(j.status) ? (
                              <button onClick={() => forceKill(j.job_id)} style={{
                                background:'#2d0f0f', color:'#f87171', border:'1px solid #7f1d1d',
                                borderRadius:5, padding:'3px 8px', fontSize:11,
                              }}>Force Kill</button>
                            ) : <span style={{ color:'#475569' }}>—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}
          </>
        )}
      </main>
    </div>
  );
}

// ─── Root ────────────────────────────────────────────────────────────────────
function App() {
  const [adminKey, setAdminKey] = useState(() => {
    try { return sessionStorage.getItem('admin_key') || ''; } catch { return ''; }
  });

  const unlock = (key) => {
    try { sessionStorage.setItem('admin_key', key); } catch {}
    setAdminKey(key);
  };
  const logout = () => {
    try { sessionStorage.removeItem('admin_key'); } catch {}
    setAdminKey('');
  };

  return adminKey
    ? <AdminPanel adminKey={adminKey} onLogout={logout}/>
    : <PasswordGate onUnlock={unlock}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
{% endraw %}
</script>
</body>
</html>
